[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  included_files = ["views/**"]
  external_node_modules = ["express", "ejs", "serverless-http", "@supabase/supabase-js", "multer", "cookie-parser"]

[[redirects]]
  from = "/*"
  to = "/.netlify/functions/app/:splat"
  status = 200
  force = false
